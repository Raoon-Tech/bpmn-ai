services:
  bpmn-ai:
    build: .
    image: bpmn-ai
    ports:
      - "8080:8080"
    environment:
      - DB_DRIVER=postgres
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=postgres
      - DB_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - DB_NAME=bpmn
      - DB_SSLMODE=disable
      - DB_AUTO_MIGRATE=true
      - LOG_LEVEL=info
      - LOG_FORMAT=json
      - AUDIT_LOG_ENABLED=true
      - AUDIT_LOG_FILE_PATH=/app/data/audit.jsonl
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_DB=bpmn
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  mysql:
    image: mysql:8
    profiles: ["mysql"]
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_PASSWORD:-mysql}
      - MYSQL_DATABASE=bpmn
    volumes:
      - mysqldata:/var/lib/mysql
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  pgdata:
  mysqldata:

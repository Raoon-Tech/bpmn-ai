name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: secret
          POSTGRES_DB: bpmn_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Run unit tests
        env:
          TEST_POSTGRES_DSN: postgres://postgres:secret@localhost:5432/bpmn_test?sslmode=disable
        run: go test -race -count=1 ./internal/... ./pkg/... ./api/... ./config/...

      - name: Run tests with coverage
        run: go test -race -coverprofile=coverage.out -covermode=atomic ./...

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          file: coverage.out

  build:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [linux, darwin, windows]
        goarch: [amd64, arm64]
        exclude:
          - goos: windows
            goarch: arm64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Build
        run: GOOS=${{matrix.goos}} GOARCH=${{matrix.goarch}} go build -o bpmn-ai-${{matrix.goos}}-${{matrix.goarch}} ./cmd/engine

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: bpmn-ai-${{matrix.goos}}-${{matrix.goarch}}
          path: bpmn-ai-${{matrix.goos}}-${{matrix.goarch}}

  docker:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t bpmn-ai:latest .

      - name: Test Docker image
        run: docker run --rm bpmn-ai:latest --help || true
